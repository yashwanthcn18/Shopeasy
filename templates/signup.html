<!-- signup.html — Fullscreen dark auth page matching login style -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — ShopEasy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }
    .auth-brand {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      color: #fff;
      margin-bottom: 28px;
      letter-spacing: 0.02em;
    }
    .auth-brand span { color: #c9a84c; }
    .auth-box {
      background: #fff;
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
    }
    .auth-box h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      margin-bottom: 24px;
      color: #111;
    }
    label {
      display: block;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #ddd;
      font-size: 0.92rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      margin-bottom: 18px;
      transition: border-color 0.15s;
    }
    input:focus { border-color: #111; }
    .btn-submit {
      width: 100%; padding: 13px;
      background: #111; color: #fff;
      border: none; cursor: pointer;
      font-family: 'Inter', sans-serif;
      font-size: 0.82rem; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: background 0.15s;
    }
    .btn-submit:hover { background: #333; }
    .hint {
      text-align: center;
      font-size: 0.82rem;
      color: #888;
      margin-top: 14px;
    }
    .hint a { color: #111; font-weight: 600; text-decoration: underline; }
    .flash {
      background: #fef9c3; border-left: 3px solid #c9a84c;
      padding: 10px 14px; margin-bottom: 18px;
      font-size: 0.85rem; color: #78580a;
    }
    @media (max-width: 480px) {
      .auth-box { padding: 28px 20px; }
      .auth-brand { font-size: 1.5rem; margin-bottom: 20px; }
    }
  </style>
</head>
<body>

  <div class="auth-brand">Shop<span>Easy</span></div>

  <div class="auth-box">
    <h2>Create an account</h2>

    {% with messages = get_flashed_messages() %}
      {% if messages %}{% for msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}{% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('signup') }}">
      <label>Full Name</label>
      <input type="text" name="name" placeholder="John Doe" required />

      <label>Email</label>
      <input type="email" name="email" placeholder="you@example.com" required />

      <label>Password</label>
      <input type="password" name="password" placeholder="••••••••" required />

      <button class="btn-submit" type="submit">Create Account</button>
    </form>

    <p class="hint">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
  </div>

</body>
</html>
