<!-- reset_password.html — Step 3: set new password after OTP verified -->
{% extends 'base.html' %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-box">
  <h2>Set New Password</h2>
  <p class="hint" style="margin-bottom:20px; text-align:left; color:#555;">
    OTP verified ✓ — Choose a new password for your account.
  </p>

  <form method="POST" action="{{ url_for('reset_password') }}">
    <label>New Password</label>
    <div style="position:relative; margin-bottom:16px;">
      <input type="password" name="new_password" id="newPw" placeholder="••••••••" required
             style="width:100%; padding:10px 40px 10px 12px;" autocomplete="new-password" />
      <button type="button"
              onclick="var i=document.getElementById('newPw'); i.type=i.type==='password'?'text':'password';"
              style="position:absolute;right:10px;top:50%;transform:translateY(-50%);
                     background:none;border:none;cursor:pointer;font-size:1rem;color:#999;">👁</button>
    </div>
    <button class="btn btn-dark" type="submit">Update Password</button>
  </form>
</div>
{% endblock %}
