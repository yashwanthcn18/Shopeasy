{% extends 'admin/base.html' %}
{% block title %}{{ 'Edit' if product else 'Add' }} Product{% endblock %}

{% block content %}
<h1 class="page-title">{{ 'Edit' if product else 'Add' }} Product</h1>

<div class="form-box">
  <form method="POST" enctype="multipart/form-data">

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:16px;">
      <div style="grid-column:span 2;">
        <label>Product Name</label>
        <input type="text" name="name" value="{{ product.name if product else '' }}" required />
      </div>

      <div>
        <label>SKU</label>
        <input type="text" name="sku" placeholder="e.g. MH-LITE-BLK-001"
               value="{{ product.sku if product else '' }}" />
      </div>

      <div>
        <label>Brand</label>
        <input type="text" name="brand" placeholder="e.g. KAPIQ"
               value="{{ product.brand if product else '' }}" />
      </div>

      <div>
        <label>Category</label>
        <input type="text" name="category" placeholder="e.g. Medal Holders"
               value="{{ product.category if product else '' }}" />
      </div>

      <div>
        <label>Stock Quantity</label>
        <input type="number" name="stock" value="{{ product.stock if product else '' }}" required />
      </div>

      <div>
        <label>Selling Price (₹)</label>
        <input type="number" name="price" step="0.01"
               value="{{ product.price if product else '' }}" required />
      </div>

      <div>
        <label>MRP / Original Price (₹) <span style="color:#94a3b8; font-weight:400;">(shown as strikethrough)</span></label>
        <input type="number" name="compare_price" step="0.01"
               placeholder="Leave blank if no discount"
               value="{{ product.compare_price if product and product.compare_price else '' }}" />
      </div>
    </div>

    <label style="margin-top:16px;">Short Description <span style="color:#94a3b8; font-weight:400;">(shown on product card)</span></label>
    <input type="text" name="short_description" placeholder="One-line summary"
           value="{{ product.short_description if product else '' }}" />

    <label>Full Description</label>
    <textarea name="description" rows="4">{{ product.description if product else '' }}</textarea>

    <label>Upload Image (jpg / png)</label>
    <input type="file" name="image_file" accept=".jpg,.jpeg,.png,.webp" />

    <label>Or paste Image URL</label>
    <input type="text" name="image_url" placeholder="https://... or /static/images/..."
           value="{{ product.image_url if product else '' }}" />

    {% if product and product.image_url %}
    <div style="margin-bottom:16px;">
      <p style="font-size:0.78rem; color:#64748b; margin-bottom:6px;">Current image:</p>
      <img src="{{ product.image_url }}" style="height:80px; border-radius:6px; object-fit:cover;" />
    </div>
    {% endif %}

    <div style="display:flex; gap:12px; margin-top:8px;">
      <button class="btn btn-dark" type="submit">{{ 'Save Changes' if product else 'Add Product' }}</button>
      <a class="btn" style="background:#f1f5f9; color:#334155;" href="{{ url_for('admin_products') }}">Cancel</a>
    </div>

  </form>
</div>
{% endblock %}
