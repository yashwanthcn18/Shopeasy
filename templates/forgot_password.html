<!-- forgot_password.html -->
{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-box">
  <h2>Reset Password</h2>
  <p class="hint" style="margin-bottom:20px; text-align:left;">Enter your email and a new password.</p>

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com" required autocomplete="off" />

    <label>New Password</label>
    <div style="position:relative; margin-bottom:16px;">
      <input type="password" name="new_password" id="newPw" placeholder="••••••••" required
             style="width:100%; padding:10px 40px 10px 12px;" autocomplete="new-password" />
      <button type="button" onclick="var i=document.getElementById('newPw'); i.type=i.type==='password'?'text':'password';"
              style="position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:#999;">👁</button>
    </div>

    <button class="btn btn-dark" type="submit">Update Password</button>
  </form>

  <p class="hint"><a href="{{ url_for('login') }}">← Back to Login</a></p>
</div>
{% endblock %}
