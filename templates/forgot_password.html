<!-- forgot_password.html — Step 1: enter email to receive OTP -->
{% extends 'base.html' %}
{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-box">
  <h2>Forgot Password?</h2>
  <p class="hint" style="margin-bottom:20px; text-align:left; color:#555;">
    Enter your registered email. We'll send a 6-digit OTP to verify it's you.
  </p>

  <form method="POST" action="{{ url_for('forgot_password') }}">
    <label>Email Address</label>
    <input type="email" name="email" placeholder="you@gmail.com" required autocomplete="off" />
    <button class="btn btn-dark" type="submit">Send OTP</button>
  </form>

  <p class="hint" style="margin-top:16px;"><a href="{{ url_for('login') }}">← Back to Login</a></p>
</div>
{% endblock %}
